<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdaCode Workbench</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="workbench">
      <aside class="left-rail">
        <div class="brand">
          <div class="mark">AC</div>
          <div>
            <h1>AdaCode</h1>
            <p>coding agent workbench</p>
          </div>
        </div>

        <button id="resetDemo" class="wide ghost" title="Reset the built-in demo workspace">
          <span aria-hidden="true">↺</span>
          Reset demo
        </button>

        <section class="rail-section">
          <div class="section-title">Workspace</div>
          <input id="workspace" value="outputs/web_demo_workspace" />
          <div id="fileList" class="file-tree"></div>
        </section>

        <section class="rail-section">
          <div class="section-title">Runtime</div>
          <label>
            Test command
            <input id="testCommand" value="python -m pytest -q" />
          </label>
          <label>
            Main model
            <input id="model" value="deepseek-ai/DeepSeek-V4-Flash" />
          </label>
          <label>
            API base URL
            <input id="baseUrl" value="" placeholder="from OPENAI_BASE_URL" />
          </label>
        </section>

        <section class="rail-section">
          <div class="section-title">Context manager</div>
          <div class="segmented" role="tablist" aria-label="context manager mode">
            <button id="cmRule" class="active" data-mode="rule">Rule</button>
            <button id="cmQwen" data-mode="qwen">Qwen SFT</button>
          </div>
          <label>
            Qwen endpoint
            <input id="cmBaseUrl" value="http://127.0.0.1:8001/v1" />
          </label>
          <label>
            Qwen model
            <input id="cmModel" value="cm" />
          </label>
          <div class="inline-fields">
            <label>
              Steps
              <input id="maxSteps" type="number" min="1" max="30" value="8" />
            </label>
            <label>
              Budget
              <input id="tokenBudget" type="number" min="200" step="100" value="1200" />
            </label>
          </div>
        </section>
      </aside>

      <main class="center-pane">
        <header class="topbar">
          <div>
            <div class="overline">Local agent session</div>
            <strong id="status">Idle</strong>
          </div>
          <div class="metrics">
            <div><span>steps</span><strong id="steps">0</strong></div>
            <div><span>keep/drop</span><strong><b id="keepCount">0</b>/<b id="dropCount">0</b></strong></div>
            <div><span>patch</span><strong id="patchChars">0 chars</strong></div>
          </div>
        </header>

        <section id="thread" class="thread">
          <article class="message assistant">
            <div class="avatar">AC</div>
            <div class="bubble">
              <div class="message-title">Ready</div>
              <p>Reset the sample workspace, then run the agent. Each step below will show the local tool call, observation, and context selection.</p>
            </div>
          </article>
        </section>

        <footer class="composer">
          <textarea id="task" rows="3" placeholder="Describe a coding task for the agent..."></textarea>
          <div class="composer-actions">
            <div class="run-meta">
              <span id="jobId">no job</span>
              <span id="cmModeLabel">Rule CM</span>
            </div>
            <button id="runAgent" class="primary" title="Run the coding agent">
              <span aria-hidden="true">▶</span>
              Run
            </button>
          </div>
        </footer>
      </main>

      <aside class="right-pane">
        <div class="tabs">
          <button class="active" data-tab="patch">Patch</button>
          <button data-tab="tests">Tests</button>
          <button data-tab="context">Context</button>
        </div>
        <pre id="patch" class="tab-body"></pre>
        <pre id="tests" class="tab-body hidden"></pre>
        <pre id="context" class="tab-body hidden"></pre>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
